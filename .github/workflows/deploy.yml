name: Deploy to Hostinger

# Runs on every push to main. Creates a one-shot Hostinger cron job that
# git-pulls this repo into the blogs.tkvibes.in docroot.
#
# Why a cron job: Hostinger shared hosting has no file-upload API endpoint,
# and the FTP credentials for this account are known-bad. A one-shot cron that
# runs `git pull` is the reliable path. See the hostinger-api skill.
#
# Required repo secret: HOSTINGER_TOKEN

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger server pull
        env:
          HOSTINGER_TOKEN: ${{ secrets.HOSTINGER_TOKEN }}
        run: |
          set -euo pipefail

          USERNAME="u990668815"
          DOCROOT="/home/$USERNAME/domains/tkvibes.in/public_html/blogs"
          REPO="https://github.com/${{ github.repository }}.git"
          API="https://developers.hostinger.com/api/hosting/v1/accounts/$USERNAME/cron-jobs"

          # Hostinger evaluates cron in UTC. Schedule 2 minutes out.
          # GitHub runners are already UTC, so date(1) needs no conversion.
          MIN=$(date -u -d '+2 minutes' +%-M)
          HR=$(date -u -d '+2 minutes' +%-H)
          DAY=$(date -u -d '+2 minutes' +%-d)
          MON=$(date -u -d '+2 minutes' +%-m)
          CRON_TIME="$MIN $HR $DAY $MON *"

          # Clone on first run, fast-forward after. Must stay under the
          # 255-char post-escape command limit.
          CMD="cd $DOCROOT && (git pull -q origin main || (git init -q && git remote add origin $REPO; git fetch -q --depth 1 origin main && git reset --hard origin/main)) && echo DEPLOYED"

          echo "Command length: ${#CMD}"
          if [ ${#CMD} -gt 245 ]; then
            echo "::warning::command is ${#CMD} chars, may exceed the 255 post-escape limit"
          fi

          PAYLOAD=$(jq -nc --arg t "$CRON_TIME" --arg c "$CMD" '{time:$t, command:$c}')

          echo "Scheduling deploy cron for $CRON_TIME UTC"
          HTTP=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST "$API" \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' \
            -H "Authorization: Bearer $HOSTINGER_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD")

          echo "HTTP $HTTP"
          cat /tmp/resp.json || true
          echo

          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
            echo "::error::Cron creation failed with HTTP $HTTP"
            echo "Run this manually in hPanel > Advanced > Cron Jobs:"
            echo "$CMD"
            exit 1
          fi

          echo "UID: $(jq -r '.uid // "unknown"' /tmp/resp.json)"

      - name: Wait for the cron to fire
        run: sleep 180

      - name: Verify the site is live
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            CODE=$(curl -sS -o /tmp/page.html -w '%{http_code}' https://blogs.tkvibes.in/ || echo 000)
            if [ "$CODE" = "200" ] && grep -q 'TKVibes' /tmp/page.html; then
              echo "Live. Homepage served $(wc -c < /tmp/page.html) bytes."
              # sanity-check the article and sitemap too
              curl -sSf -o /dev/null https://blogs.tkvibes.in/sitemap.xml && echo "sitemap.xml OK"
              curl -sSf -o /dev/null https://blogs.tkvibes.in/cheapest-way-to-self-host-n8n/ && echo "article OK"
              exit 0
            fi
            echo "Attempt $i: HTTP $CODE, not the blog yet. Retrying in 60s..."
            sleep 60
          done
          echo "::error::Site did not come up. Check the cron output in hPanel."
          head -c 400 /tmp/page.html
          exit 1

      - name: Ping IndexNow
        if: success()
        run: |
          KEY=$(curl -sS https://blogs.tkvibes.in/sitemap.xml >/dev/null && echo ok)
          URLS=$(curl -sS https://blogs.tkvibes.in/sitemap.xml \
            | grep -oP '(?<=<loc>)[^<]+' | jq -R . | jq -sc .)
          INDEXNOW_KEY="3c33dfc195e346a5bd0ea119538b09df"
          PAYLOAD=$(jq -nc \
            --arg h "blogs.tkvibes.in" \
            --arg k "$INDEXNOW_KEY" \
            --arg kl "https://blogs.tkvibes.in/$INDEXNOW_KEY.txt" \
            --argjson u "$URLS" \
            '{host:$h, key:$k, keyLocation:$kl, urlList:$u}')
          for EP in https://api.indexnow.org/indexnow https://www.bing.com/indexnow; do
            echo -n "$EP -> "
            curl -sS -o /dev/null -w '%{http_code}\n' -X POST "$EP" \
              -H 'Content-Type: application/json; charset=utf-8' -d "$PAYLOAD" || true
          done
